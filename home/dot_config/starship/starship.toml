# Starship prompt — Catppuccin Macchiato pastel palette.
# Icons: emoji + standard Unicode only — NO Nerd Font PUA glyphs. Confirmed
# 2026-07-16 on Ghostty 1.3.1: `ghostty +show-face --cp=0xE718` resolves the
# glyph to JetBrainsMono Nerd Font Mono, but the renderer still draws PUA
# blank in shell output (renderer bug, not fonts/config). 1.3.1 is the latest
# release; when a fixed Ghostty ships, PUA glyphs can replace these emoji.
"$schema" = 'https://starship.rs/config-schema.json'

# ─── Layout ─────────────────────────────────────────────────────────────────
# Line 1 (left):   os dir  on branch  (git-status)  lang  custom  k8s
# Line 1 (right):                                        cmd_duration   time
# Line 2:          ❯

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs\
$python\
$golang\
$rust\
$java\
$custom\
$kubernetes\
$fill\
$cmd_duration\
$time\
$line_break\
$jobs\
$character"""

add_newline = true
palette     = "catppuccin_macchiato"

# ─── Palette ────────────────────────────────────────────────────────────────
[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo  = "#f0c6c6"
pink      = "#f5bde6"
mauve     = "#c6a0f6"
red       = "#ed8796"
maroon    = "#ee99a0"
peach     = "#f5a97f"
yellow    = "#eed49f"
green     = "#a6da95"
teal      = "#8bd5ca"
sky       = "#91d7e3"
sapphire  = "#7dc4e4"
blue      = "#8aadf4"
lavender  = "#b7bdf8"
text      = "#cad3f5"
subtext1  = "#b8c0e0"
subtext0  = "#a5adcb"
overlay2  = "#939ab7"
overlay1  = "#8087a2"
overlay0  = "#6e738d"
surface2  = "#5b6078"
surface1  = "#494d64"
surface0  = "#363a4e"

# ─── Character ──────────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

# ─── Directory ──────────────────────────────────────────────────────────────
[directory]
style             = "bold lavender"
truncation_length = 3
truncate_to_repo  = true
read_only         = " ⊘"
read_only_style   = "bold red"
home_symbol       = "~"
format            = "[$path]($style)[$read_only]($read_only_style) "

# ─── Git ────────────────────────────────────────────────────────────────────
[git_branch]
symbol = "⎇ "
style  = "bold pink"
format = "[on ](subtext0)[$symbol$branch]($style)"

[git_commit]
commit_hash_length = 7
style              = "bold yellow"
tag_symbol         = " ⚐ "

[git_state]
style  = "bold mauve"
format = ' \([$state( $progress_current/$progress_total)]($style)\)'

# Git status — Unicode sigils, each fragment carries its own leading space so
# spacing stays single-width no matter which fragments appear.
#   ✚ modified   ● staged   ✘ deleted   » renamed   … untracked
#   ⚑ stashed    ✖ conflict   ⇡ ahead   ⇣ behind    ⇕ diverged
[git_status]
format     = '([$all_status$ahead_behind]($style))'
style      = "bold yellow"
conflicted = "[ ✖$count](red)"
ahead      = "[ ⇡$count](green)"
behind     = "[ ⇣$count](yellow)"
diverged   = "[ ⇕⇡$ahead_count⇣$behind_count](red)"
up_to_date = ""
untracked  = "[ …$count](sky)"
stashed    = "[ ⚑$count](teal)"
modified   = "[ ✚$count](peach)"
staged     = "[ ●$count](green)"
renamed    = "[ »$count](mauve)"
deleted    = "[ ✘$count](red)"

# ─── Fill (pushes right-side modules to the right edge) ─────────────────────
[fill]
symbol = " "
style  = "surface1"

# ─── Right-hand side (on line 1 via $fill) ──────────────────────────────────
[cmd_duration]
min_time          = 2000
format            = "[took $duration](overlay1)  "
show_milliseconds = false

[time]
disabled    = false
time_format = "%R"
format      = "[$time](subtext0)"

[jobs]
symbol           = "✦ "
style            = "bold blue"
format           = "[$symbol$number]($style) "
number_threshold = 1

[battery]
disabled = true

# ─── Languages (emoji / standard Unicode — Ghostty 1.3.1 can't render PUA) ──
[nodejs]
symbol         = "⬢ "
format         = " [via $symbol$version](bold green)"
style          = "bold green"
detect_files   = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[python]
symbol = "🐍 "
format = " [via $symbol$version( \\($virtualenv\\))](bold yellow)"
style  = "bold yellow"

[golang]
symbol = "🐹 "
format = " [via $symbol$version](bold teal)"
style  = "bold teal"

[rust]
symbol = "🦀 "
format = " [via $symbol$version](bold peach)"
style  = "bold peach"

[java]
symbol = "☕ "
format = " [via $symbol$version](bold blue)"
style  = "bold blue"

[kubernetes]
disabled       = false
symbol         = "☸ "
format         = " [on ](subtext0)[$symbol$context( \\($namespace\\))](bold mauve)"
style          = "bold mauve"
detect_files   = ["kustomization.yml", "kustomization.yaml", "Chart.yaml"]
detect_folders = [".kube"]

# ─── Custom modules ─────────────────────────────────────────────────────────
[custom.docker]
description  = "Docker project indicator"
detect_files = [
  "Dockerfile",
  "docker-compose.yml",
  "docker-compose.yaml",
  "compose.yml",
  "compose.yaml",
  "Dockerfile.dev",
]
command = "echo"
format  = " [🐳 docker](sapphire)"

[custom.pnpm]
description  = "pnpm workspace"
detect_files = ["pnpm-workspace.yaml"]
command      = "echo"
format       = " [pnpm](peach)"

[custom.bun]
description  = "Bun runtime"
detect_files = ["bun.lockb", "bun.lock", "bunfig.toml"]
command      = "echo"
format       = " [bun](yellow)"

[custom.uv]
description  = "uv python env (astral-sh/uv)"
detect_files = ["uv.lock"]
command      = "echo"
format       = " [uv](mauve)"

[custom.jira]
description = "Branch name contains a Jira ticket (e.g. PQ-123)"
command     = "git branch --show-current 2>/dev/null | grep -oE '[A-Z]+-[0-9]+' | head -1"
when        = 'git branch --show-current 2>/dev/null | grep -qE "[A-Z]+-[0-9]+"'
format      = " [$output](bold teal)"

# ─── Disabled: noisy modules ────────────────────────────────────────────────
[package]
disabled = true
[dotnet]
disabled = true
[nix_shell]
disabled = true
[ruby]
disabled = true
[php]
disabled = true
[perl]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
[azure]
disabled = true
[lua]
disabled = true
[conda]
disabled = true
[pulumi]
disabled = true
[terraform]
disabled = true
[docker_context]
disabled = true
